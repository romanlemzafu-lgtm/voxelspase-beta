    <meta name="description" content="VoxelSpase от OneSpase — серверы, друзья и голосовые комнаты." />

  <body>
    <div id="app">
      <div class="splash" role="status" aria-live="polite" aria-label="Загрузка VoxelSpase">
        <div class="splash-stage">
          <div class="sp-glow" aria-hidden="true"></div>
          <svg class="sp-logo" viewBox="0 0 128 128" aria-hidden="true">
            <defs>
              <linearGradient id="sp-bg" x1="0" x2="1" y1="0" y2="1">
                <stop stop-color="#7C3AED"/><stop offset="1" stop-color="#2563EB"/>
              </linearGradient>
            </defs>
            <rect class="sp-base" width="128" height="128" rx="33" fill="url(#sp-bg)"/>
            <path class="sp-tile sp-top" d="M27 37 64 58 101 37 64 16Z" fill="#D4CCFF"/>
            <path class="sp-tile sp-left" d="M27 37v45l37 22V58Z" fill="#F3E8FF"/>
            <path class="sp-tile sp-right" d="M101 37v45l-37 22V58Z" fill="#B7A4FF"/>
            <path class="sp-line" pathLength="1" d="m44 51 20 12 20-12" stroke="#6D28D9" stroke-width="5" stroke-linecap="round" fill="none"/>
          </svg>
          <div class="sp-word" aria-label="VoxelSpase"><span>V</span><span>o</span><span>x</span><span>e</span><span>l</span><span>S</span><span>p</span><span>a</span><span>s</span><span>e</span></div>
          <div class="sp-bar" aria-hidden="true"><i></i></div>
        </div>
        <p class="splash-status">Подключаемся…</p>
        <div class="sp-credit"><img src="./assets/onespase-bw.png" alt="" width="26" height="26"><span>by OneSpase</span></div>
      </div>
    </div>
    <div id="remote-audio" hidden></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <noscript>Для работы VoxelSpase включи JavaScript.</noscript>
    <dialog id="community-dialog" aria-labelledby="v4-title">
      <header>
        <h1 id="v4-title"></h1>
        <button type="button" data-v4="close" class="plain-icon" aria-label="Закрыть">×</button>
      </header>
      <p class="v4-status" role="status"></p>
      <div class="v4-content"></div>
    </dialog>
    <aside id="network-notice" hidden aria-label="Информация о подключении">
      <p>
        В некоторых сетях VoxelSpase может работать нестабильно или быть недоступен. Для подключения иногда
        может потребоваться VPN. Если сайт работает нормально, дополнительных действий не требуется.
      </p>
      <button class="btn small" type="button">Понятно</button>
    </aside>
  <dialog id="social-info"><h2></h2><p></p><form method="dialog"><button class="btn">Закрыть</button></form></dialog>
</body>
</html>
